text: "* Tu inscris ton collège (en cliquant sur Créer un compte). Tu défnis un code collège à donner aux élèves pourqu'ils s'inscrivent à l'AS de ton collège et tu crèes également un code Prof pour donner à tes collègues. Les élèves crèent leur compte directement depuis l'application mobile et les profs depuis le site internet."
